<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>台中羅氏廣告車 | LOAD Moving Advertising Billboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft JhengHei",sans-serif;
}

body{
    background:#f5f7fa;
    color:#222;
}

.hero{
    height:100vh;
    background:
    linear-gradient(rgba(255,255,255,0.75),rgba(255,255,255,0.75)),
    url('https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?q=80&w=2070');
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
}

.hero-content{
    max-width:1000px;
}

.logo{
    font-size:90px;
    font-weight:bold;
    letter-spacing:10px;
    color:#111;
}

.subtitle{
    font-size:28px;
    margin-top:10px;
    color:#555;
}

.description{
    margin-top:30px;
    font-size:22px;
    line-height:1.8;
    color:#333;
}

.btn{
    margin-top:40px;
    display:inline-block;
    padding:16px 40px;
    background:#111;
    color:white;
    text-decoration:none;
    border-radius:50px;
    transition:0.3s;
    font-size:18px;
}

.btn:hover{
    background:#ff3c3c;
}

.section{
    padding:100px 10%;
    background:white;
}

.section-title{
    font-size:42px;
    margin-bottom:30px;
    text-align:center;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
    margin-top:50px;
}

.card{
    background:#f8f9fb;
    border-radius:20px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.card h3{
    margin-bottom:20px;
}

.footer{
    background:#111;
    color:white;
    text-align:center;
    padding:40px;
}

@media(max-width:768px){

.logo{
    font-size:50px;
}

.subtitle{
    font-size:22px;
}

.description{
    font-size:18px;
}

}

</style>
</head>

<body>

<section class="hero">

<div class="hero-content">

<h1 class="logo">L.O.A.D.</h1>

<div class="subtitle">
台中羅氏廣告車
</div>

<div class="description">
移動的力量，讓品牌被城市看見。<br><br>
專業行動廣告車宣傳服務，結合都市巡迴曝光、
品牌活動推廣與高辨識度車體廣告，
打造最具行動力的城市媒體。
</div>

<a class="btn" href="#">
立即聯絡我們
</a>

</div>

</section>

<section class="section">

<h2 class="section-title">
我們的服務
</h2>

<div class="cards">

<div class="card">
<h3>品牌活動宣傳</h3>
<p>
結合商圈巡迴與高流量曝光，
提升品牌話題與現場人流。
</p>
</div>

<div class="card">
<h3>行動廣告車</h3>
<p>
動態城市曝光，
強化品牌記憶點與視覺衝擊。
</p>
</div>

<div class="card">
<h3>台中在地推廣</h3>
<p>
深耕台中商圈與活動宣傳，
提供高效率廣告曝光服務。
</p>
</div>

</div>

</section>

<footer class="footer">

L.O.A.D. 台中羅氏廣告車 © 2026

</footer>

</body>
</html>
